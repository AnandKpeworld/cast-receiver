<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>YouTube Cast Receiver</title>

<!-- Cast CAF Receiver SDK -->
<script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>

<!-- YouTube Iframe API -->
<script src="https://www.youtube.com/iframe_api"></script>

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

#player {
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>

<div id="player"></div>

<script>

let player = null;
let pendingVideoId = null;

// Called automatically by YouTube API
function onYouTubeIframeAPIReady() {

    console.log("YouTube API Ready");

    player = new YT.Player("player", {
        width: "100%",
        height: "100%",
        videoId: "",
        playerVars: {
            autoplay: 1,
            controls: 1,
            rel: 0,
            fs: 1
        },
        events: {
            onReady: function () {

                console.log("Player Ready");

                if (pendingVideoId) {
                    player.loadVideoById(pendingVideoId);
                }
            }
        }
    });
}

// Cast Receiver Context
const context =
    cast.framework.CastReceiverContext.getInstance();

// Custom Namespace
const bus =
    context.getCustomMessageBus(
        "zb.ScreenMirroring.CastifyTV.youtube"
    );

// Receive Messages
bus.onMessage = function(event) {

    console.log("Received:", event.data);

    let data;

    try {
        data = JSON.parse(event.data);
    } catch (e) {
        console.error("Invalid JSON:", e);
        return;
    }

    switch(data.action) {

        case "play":

            if(player && player.loadVideoById) {
                player.loadVideoById(data.videoId);
            } else {
                pendingVideoId = data.videoId;
            }

            break;

        case "pause":

            if(player) {
                player.pauseVideo();
            }

            break;

        case "resume":

            if(player) {
                player.playVideo();
            }

            break;

        case "stop":

            if(player) {
                player.stopVideo();
            }

            break;

        case "forward10":

            if(player && player.getCurrentTime) {

                let currentTime =
                    player.getCurrentTime();

                let duration =
                    player.getDuration();

                let newTime =
                    currentTime + 10;

                if(newTime > duration) {
                    newTime = duration;
                }

                player.seekTo(newTime, true);
            }

            break;

        case "back10":

            if(player && player.getCurrentTime) {

                let currentTime =
                    player.getCurrentTime();

                let newTime =
                    currentTime - 10;

                if(newTime < 0) {
                    newTime = 0;
                }

                player.seekTo(newTime, true);
            }

            break;

        case "seek":

            if(player && typeof data.position === "number") {
                player.seekTo(data.position, true);
            }

            break;
    }
};
// Update by Dev Ami
// Start Cast Receiver
context.start();

console.log("Cast Receiver Started");

</script>

</body>
</html>
