<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>CastConnect Receiver</title>

  <!-- Google Cast Application Framework (CAF) receiver -->
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>

  <style>
    /* Transparent ("clear") idle background, per request — nothing shows on the TV
       until real media loads. cast-media-player fills the screen when casting. */
    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0;
      background: transparent; overflow: hidden;
    }
    /* Clear media surface — no logo, name, or status, transparent when idle. */
    cast-media-player {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      --background-color: transparent;
      --splash-image: none;
    }
  </style>
</head>
<body>
  <!-- Plays everything that arrives via loadMedia(): gallery videos, IPTV streams, photos.
       YouTube is intentionally NOT handled here — it is played on the TV's own YouTube app
       via DIAL from the iOS app, so YouTube's native player and playbar are used, per the
       YouTube API Terms of Service. -->
  <cast-media-player></cast-media-player>

  <script>
    const context = cast.framework.CastReceiverContext.getInstance();

    // ---- Start the receiver ----------------------------------------------------
    const options = new cast.framework.CastReceiverOptions();
    // Keep the receiver alive when idle so the app can switch between media items
    // without the session dropping.
    options.disableIdleTimeout = true;

    context.start(options);
  </script>
</body>
</html>
